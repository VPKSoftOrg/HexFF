<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Hexagon -->
  <polygon
    points="128,24 208,72 208,184 128,232 48,184 48,72"
    fill="url(#hexGrad)"
    stroke="#0F172A"
    stroke-width="8"/>

  <!-- Binary rows -->
  <g fill="#E0F2FE" font-family="Consolas, monospace" font-size="18" font-weight="bold">
    <text x="68" y="92">01001010</text>
    <text x="68" y="116">10110101</text>
    <text x="68" y="140">00111100</text>
    <text x="68" y="164">11000011</text>
  </g>

  <!-- Central Hex Text -->
  <text
    x="128"
    y="145"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Consolas, monospace"
    font-size="48"
    font-weight="bold">
    0x
  </text>

  <!-- Cursor -->
  <rect x="152" y="104" width="10" height="54" fill="#FBBF24"/>
</svg>
